version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    environment:
      - POSTGRES_DB=todo_app
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_PORT=5432

    depends_on:
      - db

 
  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=todo_app
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    volumes:
      - zeus:/var/lib/postgresql/data

volumes:
  zeus: 