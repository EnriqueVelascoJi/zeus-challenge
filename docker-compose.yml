version: '3.8'

services:
  

  backend:
    build: ./backend
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    environment:
      - POSTGRES_DB=todo_app
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=db

    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=todo_app
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    volumes:
      - zeus:/var/lib/postgresql/data

volumes:
  zeus: 